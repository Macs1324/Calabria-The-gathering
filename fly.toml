# Fly.io deployment: one small machine running server/Dockerfile (API + web
# client), with a volume at /data for the card index and saved rooms.
# Setup and data upload: README → "Deploying to Fly.io".

app = "calabria-the-gathering"
primary_region = "ams"

[build]
  dockerfile = "server/Dockerfile"

[mounts]
  source = "calabria_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # Sleeps when nobody is connected and wakes on the next visit (a few
  # seconds); open game WebSockets keep it awake.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"  # ~190 MB in use with the full 55k-card index loaded
