[project]
name = "calabria"
version = "0.1.0"
description = "Camera-driven MTG dueling server: card recognition and game coordination"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "opencv-python-headless>=4.10",
    "numpy>=2.0,<3",
    "orjson>=3.10",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calabria"]

[project.scripts]
calabria-build-index = "calabria.cli:build_card_index_cli"
calabria-eval-scan = "calabria.cli:eval_scan_cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
